openapi: '3.0.0'
info:
 version: 1.0.0
 title: (v1.0) Dynamics 365 Business Central
 description: Business Central Standard APIs (v1.0) for Microsoft Dynamics 365 Business Central.
servers:
 - url: https://api.businesscentral.dynamics.com/v2.0/{environment}/api/v1.0
   description: Dynamics 365 Business Central API v1.0
   variables:
    environment:
     description: The Business Central environment name
     default: production
     enum: [production, sandbox]
   
paths:
 "/companies":
  get:
   summary: Returns a list of companies
   tags: 
    - company
   operationId: listCompanies
   responses:
    200:
     description: A list of companies was returned successfully.
     content:
      application/json:
       schema:
        type: object
        properties:
         value:
          type: array
          items:
           $ref: '#/components/schemas/company'
   parameters: 
   - $ref: '#/components/parameters/topParam'
   - $ref: '#/components/parameters/skipParam'
   - $ref: '#/components/parameters/limitParam'
   - $ref: '#/components/parameters/filterParam'
   - name: $select
     x-ballerina-name: select
     in: query
     description: The properties to include in the returned entities. 
     schema:
      type: array
      items:
       type: string
       enum: ['id', 'systemVersion', 'name', 'displayName', 'businessProfileId']
     style: form
     explode: false
 "/companies({company_id})":
  parameters: 
   - name: company_id
     in: path
