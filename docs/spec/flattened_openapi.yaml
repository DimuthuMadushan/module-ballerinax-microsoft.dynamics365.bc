components:
  schemas:
    DefaultDimensionsRequest:
      type: object
      properties:
        parentId:
          type: string
          description: The parent id of the default dimensions.
          format: uuid
          nullable: false
        dimensionId:
          type: string
          description: The dimension id of the default dimensions.
          format: uuid
          nullable: false
        dimensionCode:
          maxLength: 20
          type: string
          description: The dimension code of the default dimensions.
          nullable: true
        dimensionValueId:
          type: string
          description: The dimension value id of the default dimensions.
          format: uuid
          nullable: true
        dimensionValueCode:
          maxLength: 20
          type: string
          description: The dimension value code of the default dimensions.
          nullable: true
        postingValidation:
          type: string
          description: The posting validation of the default dimensions.
          nullable: true
      description: The payload used to create or update a default dimensions.
    SalesOrderRequest:
      type: object
      properties:
        id:
          type: string
          description: The id of the sales order.
          format: uuid
          nullable: false
        number:
          maxLength: 20
          type: string
          description: The number of the sales order.
          nullable: true
        externalDocumentNumber:
          maxLength: 35
          type: string
          description: The external document number of the sales order.
          nullable: true
        orderDate:
          type: string
          description: The order date of the sales order.
          format: date-time
          nullable: true
        customerId:
          type: string
          description: The customer id of the sales order.
          format: uuid
          nullable: true
        contactId:
          maxLength: 250
          type: string
          description: The contact id of the sales order.
          nullable: true
        customerNumber:
          maxLength: 20
          type: string
          description: The customer number of the sales order.
          nullable: true
        customerName:
          maxLength: 100
          type: string
          description: The customer name of the sales order.
          nullable: true
        billToName:
          maxLength: 100
          type: string
          description: The bill to name of the sales order.
          nullable: true
        billToCustomerId:
          type: string
          description: The bill to customer id of the sales order.
          format: uuid
          nullable: true
